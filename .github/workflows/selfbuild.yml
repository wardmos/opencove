name: Self Build

# Personal build pipeline for this fork. Pushing to the `selfbuild` branch
# publishes a prerelease in this repository's Releases (not just run-page
# artifacts).
#
# The Linux standalone server is compiled inside a Debian buster (glibc 2.28)
# container so its native modules (node-pty, better-sqlite3) link against an old
# glibc and run on older Linux hosts. GitHub's hosted runners ship glibc >= 2.31,
# which produces binaries that fail at load with "GLIBC_2.xx not found" on such
# hosts. We invoke the container via `docker run` on a normal host runner (rather
# than a job-level `container:`) so GitHub's JS actions keep executing on the
# host's modern Node — buster is too old to run the actions runtime reliably.

on:
  push:
    branches:
      - selfbuild
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: selfbuild-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prerelease version derived from the run number so every push is unique.
  # The `-nightly.` marker routes through the prerelease path in
  # generate-release-manifest.mjs, which auto-generates release notes
  # (curated notes are only required for stable, non-prerelease versions).
  SELF_VERSION: 0.2.0-nightly.self.${{ github.run_number }}

jobs:
  build-linux:
    name: Build (Linux server, glibc 2.28)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build standalone server in manylinux_2_28 (glibc 2.28, gcc 14)
        run: |
          docker run --rm \
            -e SELF_VERSION \
            -e CSC_IDENTITY_AUTO_DISCOVERY=false \
            -e npm_config_build_from_source=true \
            -v "$PWD":/work -w /work \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -euxo pipefail -c '
              # manylinux_2_28 = glibc 2.28 (matches Debian 10) plus a modern
              # gcc-toolset that supports C++20 (better-sqlite3 requires it; the
              # buster gcc 8 does not) and statically links the newer libstdc++
              # symbols so the result still runs on old hosts.
              set +u
              for e in /opt/rh/gcc-toolset-*/enable; do [ -f "$e" ] && . "$e"; done
              set -u
              gcc --version | head -1

              # /work is bind-mounted from the host runner user; allow the
              # container root to run git in it (release manifest reads git tags).
              git config --global --add safe.directory /work

              # node-gyp (used by electron-builder install-app-deps) needs
              # Python >= 3.8 (walrus operator); the system python is 3.6, so use
              # the newest CPython manylinux ships in /opt/python.
              PYDIR=$(ls -d /opt/python/cp31[0-9]-* | sort -V | tail -1)
              export PATH="$PYDIR/bin:$PATH"
              export npm_config_python="$PYDIR/bin/python3"
              python3 --version

              # Node 22 official binary (minimum glibc 2.28). Use .tar.gz so we
              # do not depend on xz being present in the image.
              curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.gz -o /tmp/node.tar.gz
              tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
              node -v

              corepack enable
              corepack prepare pnpm@9.6.0 --activate

              pnpm install --frozen-lockfile

              node -e "const fs=require(\"fs\");const p=JSON.parse(fs.readFileSync(\"package.json\",\"utf8\"));p.version=process.env.SELF_VERSION;fs.writeFileSync(\"package.json\",JSON.stringify(p,null,2)+\"\n\");console.log(\"version =>\",p.version)"

              # --dir only (linux-unpacked); no AppImage/deb so no FUSE/fakeroot
              # is required. The standalone server tarball is derived from the
              # unpacked runtime.
              pnpm build:unpack
              pnpm build:standalone:asset
            '

      - name: Normalize artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist || true

      - name: Upload Linux server artifact
        uses: actions/upload-artifact@v7
        with:
          name: selfbuild-linux
          path: |
            dist/opencove-server-*.tar.gz
            dist/opencove-server-*.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-15
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply self-build version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.SELF_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "package.json version => $(node -p "require('./package.json').version")"

      - name: Build release artifacts (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build:mac:arm64

      - name: Build standalone server bundle (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build:standalone:asset

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: selfbuild-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
            dist/opencove-server-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Self Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: selfbuild-*
          merge-multiple: true
          path: release-assets

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: selfbuild-${{ env.SELF_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Self Build ${{ env.SELF_VERSION }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release-assets/*
